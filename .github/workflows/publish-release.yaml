name: Publish release to NPM
on:
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC provenance
  contents: write  # Required for git tag creation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Attach to main branch
        run: git checkout main && git pull

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck, type tests, tests
        run: bun prerelease

      - name: Build
        run: bun build

      - name: Apply changesets version bumps
        run: bunx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bumps
        run: |
          git add -A
          git commit -m "chore: version packages" || echo "No changes to commit"
          git push

      - name: Publish to npm
        run: bunx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
