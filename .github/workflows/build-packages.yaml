name: Build all packages

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Format check
        run: bun format:check

      - name: Lint check
        run: bun lint:check

      - name: Build
        run: bun build:seq

      # `bun test` (the runner) would also collect every `test-random/` suite,
      # duplicating `bun run test:random` below. `bun run test` runs the
      # per-package scripts, which target `test/*` only.
      - name: Test
        run: bun run test

      - name: Randomized tests
        run: bun run test:random

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
